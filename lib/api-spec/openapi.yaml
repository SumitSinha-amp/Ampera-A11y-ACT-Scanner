openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Accessibility Scanner API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scans
    description: Accessibility scan operations
  - name: sites
    description: Site management and access control
  - name: projects
    description: Project and site association management
paths:
  /admin/database-storage:
    get:
      operationId: getDatabaseStorage
      tags: [Admin]
      summary: Get Azure storage configuration and latest reading (administrators only)
      responses:
        "200":
          description: Storage monitoring status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseStorageStatus"
    put:
      operationId: updateDatabaseStorage
      tags: [Admin]
      summary: Configure Azure storage monitoring (super administrators only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseStorageConfig"
      responses:
        "200":
          description: Updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseStorageStatus"
  /admin/database-storage/check:
    post:
      operationId: checkDatabaseStorage
      tags: [Admin]
      summary: Refresh Azure storage metrics (super administrators only)
      responses:
        "200":
          description: Latest status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseStorageStatus"
  /admin/database-storage/azure-template:
    get:
      operationId: getDatabaseStorageAzureTemplate
      tags: [Admin]
      summary: Download an Azure Monitor email alert deployment template
      responses:
        "200":
          description: Azure Resource Manager template
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      parameters:
        - name: siteId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: includeUnassociated
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Projects visible to the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "400":
          description: Invalid site ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Site access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project under a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Project deleted
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/sites:
    post:
      operationId: associateProjectSite
      tags: [projects]
      summary: Associate an existing project with a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectSiteBody"
      responses:
        "204":
          description: Association created
        "400":
          description: Invalid project or site ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/sites/{siteId}:
    delete:
      operationId: removeProjectSiteAssociation
      tags: [projects]
      summary: Remove a project/site association
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Association removed
        "409":
          description: Existing scans use the association
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /scans:
    get:
      operationId: listScans
      tags: [scans]
      summary: List all scans
      description: Returns all scan sessions with summary info
      parameters:
        - name: siteId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of scans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanSession"

    post:
      operationId: createScan
      tags: [scans]
      summary: Create a new scan
      description: Start a new accessibility scan for one or more URLs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScanBody"
      responses:
        "201":
          description: Scan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSession"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scans/{id}:
    get:
      operationId: getScan
      tags: [scans]
      summary: Get scan details
      description: Returns scan session with all page results and issues
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scan session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSessionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateScan
      tags: [scans]
      summary: Update scan metadata (name, project, site, initiator)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScanBody"
      responses:
        "204":
          description: Updated
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteScan
      tags: [scans]
      summary: Delete a scan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scans/{id}/status:
    get:
      operationId: getScanStatus
      tags: [scans]
      summary: Get live scan status
      description: Returns current scan progress and per-URL status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current scan status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanStatus"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scans/{id}/cancel:
    post:
      operationId: cancelScan
      tags: [scans]
      summary: Cancel an ongoing scan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scans/{id}/report:
    get:
      operationId: getScanReport
      tags: [scans]
      summary: Get scan report summary
      description: Returns aggregated issue counts and statistics for the scan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanReport"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scans/{scanId}/issues/{issueId}/ai-assessment/retry:
    post:
      operationId: retryAIAssessment
      tags: [scans]
      summary: Retry a failed manual-scan AI assessment
      parameters:
        - name: scanId
          in: path
          required: true
          schema:
            type: integer
        - name: issueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assessment requeued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [queued]
                required: [status]
        "403":
          description: Forbidden
        "404":
          description: Assessment not found
        "409":
          description: Assessment is not failed

  /sites/my-sites:
    get:
      operationId: getMySites
      tags: [sites]
      summary: Get sites accessible to the current user
      description: Returns all sites the authenticated user can access. Admins get all sites; regular users get only their assigned sites (direct + group).
      responses:
        "200":
          description: List of accessible sites with role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySitesResponse"

  /admin/sites/{id}/access:
    get:
      operationId: getSiteAccess
      tags: [sites]
      summary: List users and groups with access to a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Site access details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAccessResponse"

  /admin/sites/{id}/users:
    post:
      operationId: grantSiteUserAccess
      tags: [sites]
      summary: Grant a user access to a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantSiteUserBody"
      responses:
        "201":
          description: Access granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /admin/sites/{id}/users/{userId}:
    delete:
      operationId: revokeSiteUserAccess
      tags: [sites]
      summary: Revoke a user's access to a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Access revoked

  /admin/sites/{id}/groups:
    post:
      operationId: grantSiteGroupAccess
      tags: [sites]
      summary: Grant a group access to a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantSiteGroupBody"
      responses:
        "201":
          description: Access granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /admin/sites/{id}/groups/{groupId}:
    delete:
      operationId: revokeSiteGroupAccess
      tags: [sites]
      summary: Revoke a group's access to a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Access revoked

  /scans/parse-sitemap:
    post:
      operationId: parseSitemap
      tags: [scans]
      summary: Parse a sitemap URL and return its URLs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseSitemapBody"
      responses:
        "200":
          description: List of URLs from sitemap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseSitemapResponse"
        "400":
          description: Invalid sitemap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/data-protection:
    get:
      operationId: getDataProtection
      responses:
        "200":
          description: Protection status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectionStatus" }
  /admin/data-protection/events:
    get:
      operationId: getDataProtectionEvents
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: entity, in: query, schema: { type: string } }
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                required: [events, page, hasMore]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/ProtectionAuditEvent" } }
                  page: { type: integer }
                  hasMore: { type: boolean }
  /admin/data-protection/archived:
    get:
      operationId: getDataProtectionArchived
      parameters:
        - { name: entity, in: query, schema: { type: string, enum: [projects, sites, users, app_issues] } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Archived records
          content:
            application/json:
              schema:
                type: object
                required: [entity, records, page, hasMore]
                properties:
                  entity: { type: string }
                  records: { type: array, items: { $ref: "#/components/schemas/ProtectionArchivedRecord" } }
                  page: { type: integer }
                  hasMore: { type: boolean }
  /admin/data-protection/restore:
    post:
      operationId: restoreDataProtectionRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProtectionRestoration" }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectionOperationResult" }
  /admin/data-protection/checkpoint:
    post:
      operationId: createDataProtectionCheckpoint
      responses:
        "200":
          description: Checkpoint recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectionCheckpoint" }
  /admin/data-protection/storage-check:
    post:
      operationId: verifyDataProtectionStorage
      responses:
        "200":
          description: Independent storage verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectionOperationResult" }
  /admin/data-protection/retry:
    post:
      operationId: retryDataProtectionEvidence
      responses:
        "200":
          description: Evidence retry status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectionStatus" }
  /admin/data-protection/exports:
    post:
      operationId: createDataProtectionExport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProtectionRecoveryInput" }
      responses:
        "201":
          description: Encrypted business metadata export
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectionRecoveryExport" }
  /admin/data-protection/exports/{id}/verify:
    post:
      operationId: verifyDataProtectionExport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProtectionRecoveryInput" }
      responses:
        "200":
          description: Integrity verified; no records changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectionOperationResult" }
  /admin/data-protection/exports/{id}/download:
    get:
      operationId: downloadDataProtectionExport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Encrypted file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /admin/data-protection/events/{id}/evidence:
    get:
      operationId: downloadDataProtectionEvidence
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Independent audit evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectionAuditEvent" }
  /admin/data-protection/issue-backups:
    get:
      operationId: getIssueRecoveryBackups
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 2048 } }
      responses:
        "200":
          description: Independent R2 backup catalogue and scheduled backup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueRecoveryCatalogue" }
    post:
      operationId: createIssueRecoveryBackup
      responses:
        "202":
          description: Backup started; poll catalogue status for completion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectionOperationResult" }
  /admin/data-protection/issue-backups/{id}/preview:
    post:
      operationId: previewIssueRecoveryBackup
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Read-only restore preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueRecoveryPreview" }
  /admin/data-protection/issue-backups/{id}/restore:
    post:
      operationId: restoreIssueRecoveryBackup
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueRecoveryRestoration" }
      responses:
        "200":
          description: Missing issue records restored transactionally; existing content not overwritten
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectionOperationResult" }
components:
  schemas:
    IssueRecoveryRestoration:
      type: object
      required: [previewHash, reason, confirmation]
      properties:
        previewHash: { type: string }
        reason: { type: string, minLength: 5, maxLength: 500 }
        confirmation: { type: string, enum: [RESTORE ISSUES] }
    IssueRecoveryBackup:
      type: object
      required: [id, createdAt, sizeBytes]
      properties:
        id: { type: string }
        createdAt: { type: ["string", "null"], format: date-time }
        sizeBytes: { type: integer }
    IssueRecoveryCatalogue:
      type: object
      required: [namespace, intervalMinutes, state, backups, nextCursor]
      properties:
        namespace: { type: string }
        intervalMinutes: { type: integer }
        state:
          type: object
          additionalProperties: true
          properties:
            running: { type: ["boolean", "null"] }
            last_backup_at: { type: ["string", "null"], format: date-time }
            last_backup_id: { type: ["string", "null"] }
            last_started_at: { type: ["string", "null"], format: date-time }
            last_error: { type: ["string", "null"] }
            counts: { type: object, additionalProperties: { type: integer } }
        backups:
          type: array
          items: { $ref: "#/components/schemas/IssueRecoveryBackup" }
        nextCursor: { type: ["string", "null"] }
    IssueRecoveryPreview:
      type: object
      required: [backupId, createdAt, previewHash, counts, backupCounts, existingIssues, attachmentsToRelink, warnings, conflicts, canRestore]
      properties:
        backupId: { type: string }
        createdAt: { type: string, format: date-time }
        previewHash: { type: string }
        counts: { type: object, additionalProperties: { type: integer } }
        backupCounts: { type: object, additionalProperties: { type: integer } }
        existingIssues: { type: integer }
        attachmentsToRelink: { type: integer }
        warnings: { type: array, items: { type: string } }
        conflicts: { type: array, items: { type: string } }
        canRestore: { type: boolean }
    ProtectionOperationResult:
      type: object
      additionalProperties: true
    ProtectionRestoration:
      type: object
      required: [entity, id, reason]
      properties:
        entity: { type: string, enum: [projects, sites, users, app_issues] }
        id: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 5, maxLength: 500 }
    ProtectionRecoveryInput:
      type: object
      required: [passphrase]
      properties:
        passphrase: { type: string, minLength: 16, maxLength: 512 }
    ProtectionArchivedRecord:
      type: object
      required: [id, label, created_at]
      properties:
        id: { type: integer }
        label: { type: ["string", "null"] }
        created_at: { type: string, format: date-time }
    ProtectionAuditEvent:
      type: object
      required: [id, created_at, entity_type, entity_id, action, source, database_actor]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        entity_type: { type: string }
        entity_id: { type: string }
        action: { type: string }
        actor_id: { type: ["string", "null"] }
        database_actor: { type: string }
        source: { type: string }
        details: { type: object, additionalProperties: true }
        uploaded_at: { type: ["string", "null"], format: date-time }
        object_key: { type: ["string", "null"] }
        attempts: { type: integer }
        last_error: { type: ["string", "null"] }
    ProtectionCheckpoint:
      type: object
      required: [id, checked_at, counts, warnings]
      properties:
        id: { type: string }
        checked_at: { type: string, format: date-time }
        counts: { type: object, additionalProperties: { type: integer } }
        warnings: { type: array, items: { type: string } }
    ProtectionRecoveryExport:
      type: object
      required: [id, created_at, size_bytes, counts, sha256]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        size_bytes: { type: integer }
        counts: { type: object, additionalProperties: { type: integer } }
        sha256: { type: string }
    ProtectionStatus:
      type: object
      required: [storage, audit, database, checkpoint, exports]
      properties:
        storage:
          type: object
          required: [configured, bucket, verifiedAt, error]
          properties:
            configured: { type: boolean }
            bucket: { type: ["string", "null"] }
            verifiedAt: { type: ["string", "null"], format: date-time }
            error: { type: ["string", "null"] }
        audit:
          type: object
          required: [total, pending, failed]
          properties:
            total: { type: integer }
            pending: { type: integer }
            failed: { type: integer }
            oldest_pending_at: { type: ["string", "null"], format: date-time }
            last_uploaded_at: { type: ["string", "null"], format: date-time }
        database:
          type: object
